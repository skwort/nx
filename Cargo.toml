[package]
name = "nx"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
directories = "6"
notify-rust = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
